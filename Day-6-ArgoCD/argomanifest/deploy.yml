apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiggy-app
  namespace: myapp
  labels:
    app: swiggy-app

spec:
  replicas: 15

  selector:
    matchLabels:
      app: swiggy-app

  template:
    metadata:
      labels:
        app: swiggy-app

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: swiggy-app
          image: httpd:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
