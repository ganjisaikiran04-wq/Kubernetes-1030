apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ganjisaikiran04-wq/Kubernetes-1030.git
    targetRevision: main
    path: Day-9-Helm

    helm:
      parameters:
        - name: replicaCount
          value: "4"

  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true